version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: classroom-api:latest
    container_name: classroom_api_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      - RUN_SEED=true  # Cámbialo a 'false' después del primer despliegue
      - DB_HOST=mysql
    volumes:
      - uploads_data:/app/uploads
    networks:
      - classroom_net
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: classroom_mysql_prod
    restart: unless-stopped
    env_file:
      - .env.mysql
    # No exponemos el puerto 3306 al exterior por seguridad, 
    # la API se conecta por la red interna classroom_net
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - classroom_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

networks:
  classroom_net:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
