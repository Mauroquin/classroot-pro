version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: classroom-api:latest
    container_name: classroom_api_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      - RUN_SEED=true
      - DB_HOST=classroom_mysql_prod
    volumes:
      - uploads_data:/app/uploads
    networks:
      - classroom_net
    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: classroom_mysql_prod
    restart: unless-stopped
    env_file:
      - .env.mysql
    # No exponemos el puerto 3306 al exterior por seguridad, 
    # la API se conecta por la red interna classroom_net
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - classroom_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

networks:
  classroom_net:
    driver: bridge

# ... (todo lo anterior está perfecto)

volumes:
  # Definimos los nombres de los volúmenes que usamos arriba en 'services'
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/dev-disk-by-uuid-8f833626-ada9-4822-8061-ea9a6ddcaddb/classroom_data/mysql
  
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/dev-disk-by-uuid-8f833626-ada9-4822-8061-ea9a6ddcaddb/classroom_data/uploads

